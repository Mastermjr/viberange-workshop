# Validated against the prepared k8s-goat-attack scenario.
# Container credential access through a mounted service-account token, ATT&CK T1552.007.

name: "Container reads Kubernetes service-account token"
severity: high
schedule: "*/1 * * * *"
datasource: clickhouse-ir
query: |
  SELECT
    membership.run_id AS experiment_run,
    toString(event.event_id) AS event_id,
    'tetragon' AS source,
    event.event_time,
    event.range_id,
    event.source_host,
    event.namespace,
    event.pod_name,
    event.container_name,
    event.exec_id,
    event.parent_exec_id,
    event.binary,
    event.arguments
  FROM ir.tetragon_events AS event
  INNER JOIN ir.raw_events_by_run AS membership ON event.event_id = membership.event_id
  WHERE membership.source_type = 'tetragon'
    AND event.event_time > now() - INTERVAL 5 MINUTE
    AND event.event_type = 'process_exec'
    AND event.binary IN ('/bin/cat', '/usr/bin/cat')
    AND position(event.arguments, '/var/run/secrets/kubernetes.io/serviceaccount/token') > 0
threshold: 1
webhook: harness-collector
validation:
  run_id: detection-validation-20261103T061611Z
