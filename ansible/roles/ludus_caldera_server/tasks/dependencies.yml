---
- name: Install Caldera system dependencies
  become: true
  ansible.builtin.apt:
    name:
      - git
      - curl
      - wget
      - pipenv
      - lsof
      - net-tools
      - python3
      - python3-venv
      - python3-pip
      - build-essential
      - libffi-dev
      - libxml2-dev
      - libxslt1-dev
      - zlib1g-dev
    update_cache: "{{ not caldera_template_manifest.stat.exists }}"

# Modified for VibeRange: Caldera 5.3.0 dependencies do not build reliably on
# Kali rolling's system Python 3.14. uv provides a pinned runtime per role.
- name: Install uv Python/runtime manager
  become: true
  ansible.builtin.shell: curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR=/usr/local/bin sh
  args:
    creates: /usr/local/bin/uv
